<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="فلش‌کارت هماتولوژی؛ مرور تصویری یافته‌های مورفولوژیک خون و آزمون تشخیص چشمی برای دانشجویان علوم آزمایشگاهی."
    />
    <meta name="theme-color" content="#f6f4ef" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>فلش‌کارت هماتولوژی | مرور تصویری یافته‌های خون</title>
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("hemato.theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (error) {
          theme = "light";
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0f1413" : "#f6f4ef");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; text-align: center; font-family: sans-serif">
        برای استفاده از فلش‌کارت هماتولوژی، جاوااسکریپت مرورگر خود را فعال کنید.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
